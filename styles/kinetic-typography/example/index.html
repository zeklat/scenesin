<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scenesin - Kinetic Typography</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Black.otf') format('opentype');
      font-weight: 900;
      font-style: normal;
    }
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-ExtraBold.otf') format('opentype');
      font-weight: 800;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
